name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib nasm qemu-system-x86
      - name: build
        run: make all
      - name: host unit tests
        run: make host-test
      - name: boot test (qemu, headless)
        run: make ci-boot
